<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 420" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">产品矩阵卡片</title>
  <desc id="desc">Kun Suite 核心产品矩阵：KunTunet、KunTerminal、KunSQL 三张产品卡片示意。</desc>

